name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (assets + PHPUnit + Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, pdo, pdo_sqlite, sqlite3, bcmath, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up Node
        # Node is a build-time-only tool here — Laravel Mix compiles
        # resources/{js,sass} once into public/{js,css}; nothing at runtime
        # needs a Node process (see Conversion-README.md: no persistent
        # Next.js/Node server in production).
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build front-end assets (Laravel Mix)
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run test suite
        # phpunit.xml already points DB_CONNECTION/DB_DATABASE at an
        # in-memory sqlite database for the testing environment — no
        # services or migrations to provision here. Piped through tee (not
        # just run directly) so the output is still on hand for the summary
        # step below even when this step fails; GitHub Actions runs `run:`
        # blocks with `pipefail`, so the pipe doesn't swallow a nonzero exit.
        run: php artisan test --colors=never | tee test-output.txt

      - name: Publish test output to job summary
        if: always()
        run: |
          {
            echo '### Backend test output'
            echo '```'
            cat test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
